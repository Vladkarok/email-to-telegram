name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emailbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://app:test@localhost:5432/emailbot_test
      # Real-Postgres suites (tests/db) create and drop their own databases here.
      TEST_DATABASE_URL: postgres://app:test@localhost:5432/postgres
      TELEGRAM_BOT_TOKEN: 123456:test
      MAIL_DOMAIN: example.com
      PUBLIC_BASE_URL: https://mail.example.com
      HTTP_PORT: "3000"
      HMAC_SECRET: test-hmac-secret-32-chars-minimum-x
      WORKER_SECRET: test-worker-secret-32-chars-min-x
      ATTACHMENT_DIR: /tmp/test-attachments
      RAW_EMAIL_DIR: /tmp/test-rawemails
      ATTACHMENT_TTL_HOURS: "336"
      RAW_EMAIL_TTL_HOURS: "336"
      MAX_SIZE_BYTES: "10485760"
      LOG_LEVEL: silent
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm --prefix cloudflare-worker ci

      - name: Typecheck
        run: npm run typecheck

      - name: Worker typecheck
        run: npm --prefix cloudflare-worker run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Shellcheck the deploy script
        run: shellcheck .github/scripts/*.sh

      # A review aid for the migrations this change adds, not a proof of
      # compatibility. See CONTRIBUTING.md, "Database migrations".
      - name: Migration compatibility lint
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare with; skipped."
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            # After a force-push the previous head may be gone; pull
            # requests always have their base.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then exit 1; fi
            echo "::warning::Cannot fetch $BASE_SHA; migration compatibility lint skipped."
            exit 0
          fi
          added=$(git diff --no-renames --diff-filter=A --name-only "$BASE_SHA" HEAD -- 'drizzle/*.sql')
          if [ -z "$added" ]; then
            echo "No added migrations."
            exit 0
          fi
          mapfile -t files <<<"$added"
          npx tsx .github/scripts/migration-compat-lint.ts "${files[@]}"

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build
