name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/agent/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".codex/**"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "docs/operations/**"
      - "docs/examples/**"
      - "docs/hosted/**"
      # Monitoring stack, host agent and dashboards deploy on their own.
      - "monitoring/**"
      - ".github/workflows/deploy-monitoring.yml"
      - ".github/workflows/deploy-monitoring-agent.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Runs start in trigger order and none replaces another, so the last push to
# main is the one that ends up deployed. Each run deploys the image it built,
# tagged with its commit, together with that commit's compose file.
concurrency:
  group: deploy-staging
  cancel-in-progress: false
  queue: max

jobs:
  build-and-push:
    name: Build and push :main image
    if: github.repository == 'Vladkarok/email-to-telegram'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: main-${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vladkarok/email-to-telegram:main
            ghcr.io/vladkarok/email-to-telegram:main-${{ github.sha }}

  deploy:
    name: Deploy to staging VPS
    if: github.repository == 'Vladkarok/email-to-telegram'
    runs-on: [self-hosted, linux, x64, email-tg-staging]
    needs: build-and-push
    timeout-minutes: 55
    # One host-mutating job per VM at a time, shared with the monitoring
    # workflows; a pending run waits in the queue instead of replacing another.
    concurrency:
      group: host-staging
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # No lock needed: a fresh directory only this run uses. The Deploy step
      # installs the files from it under the host lock.
      - name: Upload deploy files to staging
        run: |
          set -euo pipefail
          incoming=$(tar -cf - docker-compose.yml -C .github/scripts deploy-app.sh |
            timeout -k 10 120 ssh staging 'd=$(mktemp -d "$HOME/.etg-incoming.XXXXXXXX") && tar -xf - -C "$d" && echo "$d"')
          case $incoming in
            /*/.etg-incoming.*) ;;
            *) echo "unexpected upload directory: $incoming" >&2; exit 1 ;;
          esac
          echo "ETG_INCOMING=$incoming" >> "$GITHUB_ENV"

      # Everything below runs under one hold of the host lock (15-minute wait
      # at most): the network check, the registry login, installing the new
      # compose file as docker-compose.next.yml and deploy-app.sh, and the
      # script. The script pulls, migrates first and replaces with the new
      # file, waits for healthy and ready, and only then renames it to
      # docker-compose.yml; on any failure it deletes it, and a rollback runs
      # the previous image with docker-compose.yml. It prints the availability
      # report.
      #
      # Worst case, every bound used: the lock wait 15 min; the script's
      # stages 22 min and its other Docker calls about 6 min (20 s each); this
      # job's own calls about 8 min (upload 120 s, network check 2 x 60 s,
      # login 120 s, cleanup 60 s, each killed 10 s after its bound). About
      # 51 minutes, inside the 55-minute job timeout.
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # The image this run built, not the moving :main tag.
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          TOOLING_COMMIT: ${{ github.sha }}
        run: |
          ssh staging bash << EOF
          set -e
          exec 9>>~/.etg-deploy.lock
          flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }

          # docker-compose.yml declares monitoring_scrape as external; create
          # it on a host that has never had the monitoring stack.
          timeout -k 10 60 docker network inspect monitoring_scrape >/dev/null 2>&1 ||
            timeout -k 10 60 docker network create monitoring_scrape

          cd ~/email-to-telegram
          echo "${GHCR_TOKEN}" | timeout -k 10 120 docker login ghcr.io -u vladkarok --password-stdin

          # Files are renamed into place, never written in place.
          # docker-compose.yml stays the running release's: the script renames
          # docker-compose.next.yml over it once the new release is verified,
          # and deletes it otherwise.
          cp "${ETG_INCOMING}/docker-compose.yml" docker-compose.next.yml.tmp
          cp "${ETG_INCOMING}/deploy-app.sh" deploy-app.sh.tmp
          rm -rf "${ETG_INCOMING}"
          mv -f docker-compose.next.yml.tmp docker-compose.next.yml
          mv -f deploy-app.sh.tmp deploy-app.sh

          IMAGE_TAG="${IMAGE_TAG}" DEPLOY_TOOLING_COMMIT="${TOOLING_COMMIT}" bash ./deploy-app.sh </dev/null
          EOF

      # For a run that failed or was cancelled before the Deploy step installed
      # the files. A Deploy still waiting for the lock then finds no files and
      # stops without changing anything.
      - name: Remove the uploaded files
        if: always()
        run: |
          if [ -n "${ETG_INCOMING:-}" ]; then
            timeout -k 10 60 ssh staging "rm -rf '$ETG_INCOMING'"
          fi
