name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/agent/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".codex/**"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "docs/operations/**"
      - "docs/examples/**"
      - "docs/hosted/**"
      # Monitoring stack, host agent and dashboards deploy on their own.
      - "monitoring/**"
      - ".github/workflows/deploy-monitoring.yml"
      - ".github/workflows/deploy-monitoring-agent.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Runs start in trigger order and none replaces another, so the last push to
# main is the one that ends up deployed. Each run deploys the image it built,
# tagged with its commit, together with that commit's compose file.
concurrency:
  group: deploy-staging
  cancel-in-progress: false
  queue: max

jobs:
  build-and-push:
    name: Build and push :main image
    if: github.repository == 'Vladkarok/email-to-telegram'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: main-${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vladkarok/email-to-telegram:main
            ghcr.io/vladkarok/email-to-telegram:main-${{ github.sha }}

  deploy:
    name: Deploy to staging VPS
    if: github.repository == 'Vladkarok/email-to-telegram'
    runs-on: [self-hosted, linux, x64, email-tg-staging]
    needs: build-and-push
    timeout-minutes: 45
    # One host-mutating job per VM at a time, shared with the monitoring
    # workflows; a pending run waits in the queue instead of replacing another.
    concurrency:
      group: host-staging
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Every remote mutation takes ~/.etg-deploy.lock (flock, 15 minutes at
      # most), shared with the monitoring deploys on this host.
      - name: Ensure monitoring_scrape network exists
        # docker-compose.yml declares monitoring_scrape as external so
        # Prometheus (running in the sibling monitoring compose) can
        # resolve `app`. Compose refuses to start if it's missing. Create
        # it idempotently here in case this workflow races ahead of the
        # monitoring deploy workflow on a fresh host.
        run: |
          ssh staging 'exec 9>>~/.etg-deploy.lock && flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          docker network inspect monitoring_scrape >/dev/null 2>&1 || docker network create monitoring_scrape'

      - name: Copy compose file to staging
        run: |
          ssh staging 'exec 9>>~/.etg-deploy.lock && flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          cat > ~/email-to-telegram/docker-compose.yml' < docker-compose.yml

      - name: Copy deploy script to staging
        # Under the host lock; written to a temp file and renamed, so a copy
        # never changes the file a running deploy is reading.
        run: |
          ssh staging 'exec 9>>~/.etg-deploy.lock && flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          cat > ~/email-to-telegram/deploy-app.sh.tmp && mv -f ~/email-to-telegram/deploy-app.sh.tmp ~/email-to-telegram/deploy-app.sh' < .github/scripts/deploy-app.sh

      # deploy-app.sh pulls, migrates first, replaces, waits for healthy and
      # ready, rolls back to the previous image on failure and prints the
      # availability report. Its stages are bounded (22 minutes in all); with
      # the 15-minute wait for the host lock that stays inside the 45-minute
      # job timeout.
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # The image this run built, not the moving :main tag.
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          TOOLING_COMMIT: ${{ github.sha }}
        run: |
          ssh staging bash << EOF
          set -e
          exec 9>>~/.etg-deploy.lock
          flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          cd ~/email-to-telegram

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u vladkarok --password-stdin
          IMAGE_TAG="${IMAGE_TAG}" DEPLOY_TOOLING_COMMIT="${TOOLING_COMMIT}" bash ./deploy-app.sh </dev/null
          EOF
