name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/agent/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".codex/**"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "docs/operations/**"
      - "docs/examples/**"
      - "docs/hosted/**"
      # Monitoring stack, host agent and dashboards deploy on their own.
      - "monitoring/**"
      - ".github/workflows/deploy-monitoring.yml"
      - ".github/workflows/deploy-monitoring-agent.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Runs start in trigger order and none replaces another, so the last push to
# main is the one that ends up deployed. Each run deploys the image it built,
# tagged with its commit, together with that commit's compose file.
concurrency:
  group: deploy-staging
  cancel-in-progress: false
  queue: max

jobs:
  build-and-push:
    name: Build and push :main image
    if: github.repository == 'Vladkarok/email-to-telegram'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: main-${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vladkarok/email-to-telegram:main
            ghcr.io/vladkarok/email-to-telegram:main-${{ github.sha }}

  deploy:
    name: Deploy to staging VPS
    if: github.repository == 'Vladkarok/email-to-telegram'
    runs-on: [self-hosted, linux, x64, email-tg-staging]
    needs: build-and-push
    timeout-minutes: 50
    # One host-mutating job per VM at a time, shared with the monitoring
    # workflows; a pending run waits in the queue instead of replacing another.
    concurrency:
      group: host-staging
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # No lock needed: a fresh directory only this run uses. The Deploy step
      # installs the files from it under the host lock.
      - name: Upload deploy files to staging
        run: |
          set -euo pipefail
          incoming=$(tar -cf - docker-compose.yml -C .github/scripts deploy-app.sh |
            timeout 120 ssh staging 'd=$(mktemp -d "$HOME/.etg-incoming.XXXXXXXX") && tar -xf - -C "$d" && echo "$d"')
          case $incoming in
            /*/.etg-incoming.*) ;;
            *) echo "unexpected upload directory: $incoming" >&2; exit 1 ;;
          esac
          echo "ETG_INCOMING=$incoming" >> "$GITHUB_ENV"

      # Everything below runs under one hold of the host lock (15-minute wait
      # at most): the network check, keeping the old compose file for the
      # rollback, installing the new files and deploy-app.sh. The script pulls,
      # migrates first, replaces, waits for healthy and ready, rolls back to
      # the previous image on failure and prints the availability report. Its
      # stages are bounded (22 minutes in all) and every other Docker call to
      # 20 s (a few minutes more at worst); with the lock wait that stays
      # inside the 50-minute job timeout.
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # The image this run built, not the moving :main tag.
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          TOOLING_COMMIT: ${{ github.sha }}
        run: |
          ssh staging bash << EOF
          set -e
          exec 9>>~/.etg-deploy.lock
          flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }

          # docker-compose.yml declares monitoring_scrape as external; create
          # it on a host that has never had the monitoring stack.
          timeout 60 docker network inspect monitoring_scrape >/dev/null 2>&1 ||
            timeout 60 docker network create monitoring_scrape

          cd ~/email-to-telegram
          # Files are renamed into place, never written in place. The rollback
          # starts the previous image with the compose file it ran with.
          cp "${ETG_INCOMING}/docker-compose.yml" docker-compose.yml.tmp
          cp "${ETG_INCOMING}/deploy-app.sh" deploy-app.sh.tmp
          rm -rf "${ETG_INCOMING}"
          if [ -f docker-compose.yml ]; then
            cp -p docker-compose.yml docker-compose.previous.yml.tmp
            mv -f docker-compose.previous.yml.tmp docker-compose.previous.yml
          fi
          mv -f docker-compose.yml.tmp docker-compose.yml
          mv -f deploy-app.sh.tmp deploy-app.sh

          echo "${GHCR_TOKEN}" | timeout 120 docker login ghcr.io -u vladkarok --password-stdin
          IMAGE_TAG="${IMAGE_TAG}" DEPLOY_TOOLING_COMMIT="${TOOLING_COMMIT}" bash ./deploy-app.sh </dev/null
          EOF

      # For a run that failed or was cancelled before the Deploy step installed
      # the files. A Deploy still waiting for the lock then finds no files and
      # stops without changing anything.
      - name: Remove the uploaded files
        if: always()
        run: |
          if [ -n "${ETG_INCOMING:-}" ]; then
            timeout 60 ssh staging "rm -rf '$ETG_INCOMING'"
          fi
