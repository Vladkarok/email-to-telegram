name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to deploy, for example v1.7.1
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Runs of this workflow start in trigger order and queue (queue: max) instead
# of replacing each other; the jobs that touch the prod VM also share host-prod
# with the prod agent deploy. Only main's definition of this workflow is a
# supported entry point; a rollback dispatches it with an older release_tag.
concurrency:
  group: deploy-release
  cancel-in-progress: false
  queue: max

jobs:
  resolve-release:
    name: Resolve release tag
    if: github.repository == 'Vladkarok/email-to-telegram'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: resolve
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [ -z "$release_tag" ]; then
            echo "Release tag is required" >&2
            exit 1
          fi

          git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" >/dev/null
          release_sha=$(git rev-list -n 1 "$release_tag")
          git merge-base --is-ancestor "$release_sha" origin/main

          # A new tag must carry its version in package.json so the build log,
          # the image tag and the git tag all agree. Skipped on workflow_dispatch:
          # that path redeploys an existing tag (the rollback route) and tags up
          # to v1.6.3 predate the bump.
          if [ "${{ github.event_name }}" = "push" ]; then
            pkg_version=$(git show "${release_sha}:package.json" | jq -r .version)
            if [ "v${pkg_version}" != "$release_tag" ]; then
              echo "package.json version ${pkg_version} does not match release tag ${release_tag}; bump it in a PR before tagging" >&2
              exit 1
            fi
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push Docker image
    if: github.repository == 'Vladkarok/email-to-telegram' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: resolve-release
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vladkarok/email-to-telegram:latest
            ghcr.io/vladkarok/email-to-telegram:${{ needs.resolve-release.outputs.release_tag }}

  deploy-from-tag-push:
    name: Deploy to VPS
    if: github.repository == 'Vladkarok/email-to-telegram' && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, email-tg-prod]
    timeout-minutes: 45
    concurrency:
      group: host-prod
      cancel-in-progress: false
      queue: max
    needs: [resolve-release, build-and-push]

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Ensure monitoring_scrape network exists
        # docker-compose.yml declares monitoring_scrape as external. Create
        # it idempotently so deploys do not fail on a fresh prod host that
        # has never had the monitoring stack provisioned.
        run: |
          ssh prod 'exec 9>>~/.etg-deploy.lock && flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          docker network inspect monitoring_scrape >/dev/null 2>&1 || docker network create monitoring_scrape'

      - name: Copy compose file to prod
        # Under the host lock, like every remote mutation (flock, 15 minutes at most).
        run: |
          ssh prod 'exec 9>>~/.etg-deploy.lock && flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          cat > ~/email-to-telegram/docker-compose.yml' < docker-compose.yml

      - name: Copy deploy script to prod
        # Under the host lock; written to a temp file and renamed, so a copy
        # never changes the file a running deploy is reading.
        run: |
          ssh prod 'exec 9>>~/.etg-deploy.lock && flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          cat > ~/email-to-telegram/deploy-app.sh.tmp && mv -f ~/email-to-telegram/deploy-app.sh.tmp ~/email-to-telegram/deploy-app.sh' < .github/scripts/deploy-app.sh

      # deploy-app.sh pulls, migrates first, replaces, waits for healthy and
      # ready, rolls back to the previous image on failure and prints the
      # availability report. Its stages are bounded (22 minutes in all); with
      # the 15-minute wait for the host lock that stays inside the 45-minute
      # job timeout.
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
          TOOLING_COMMIT: ${{ github.sha }}
        run: |
          ssh prod bash << EOF
          set -e
          exec 9>>~/.etg-deploy.lock
          flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          cd ~/email-to-telegram

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u vladkarok --password-stdin
          IMAGE_TAG="${RELEASE_TAG}" DEPLOY_TOOLING_COMMIT="${TOOLING_COMMIT}" bash ./deploy-app.sh </dev/null
          EOF

  redeploy-existing-release:
    name: Redeploy existing release to VPS
    if: github.repository == 'Vladkarok/email-to-telegram' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, email-tg-prod]
    timeout-minutes: 45
    concurrency:
      group: host-prod
      cancel-in-progress: false
      queue: max
    needs: resolve-release

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      # The compose file comes from the release, the deploy script from this
      # workflow's own commit: a release older than the script has none.
      - name: Checkout deploy tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: deploy-tooling
          sparse-checkout: .github/scripts

      - name: Ensure monitoring_scrape network exists
        # docker-compose.yml declares monitoring_scrape as external. Create
        # it idempotently so deploys do not fail on a fresh prod host that
        # has never had the monitoring stack provisioned.
        run: |
          ssh prod 'exec 9>>~/.etg-deploy.lock && flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          docker network inspect monitoring_scrape >/dev/null 2>&1 || docker network create monitoring_scrape'

      - name: Copy compose file to prod
        # Under the host lock, like every remote mutation (flock, 15 minutes at most).
        run: |
          ssh prod 'exec 9>>~/.etg-deploy.lock && flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          cat > ~/email-to-telegram/docker-compose.yml' < docker-compose.yml

      - name: Copy deploy script to prod
        # Under the host lock; written to a temp file and renamed, so a copy
        # never changes the file a running deploy is reading.
        run: |
          ssh prod 'exec 9>>~/.etg-deploy.lock && flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          cat > ~/email-to-telegram/deploy-app.sh.tmp && mv -f ~/email-to-telegram/deploy-app.sh.tmp ~/email-to-telegram/deploy-app.sh' < deploy-tooling/.github/scripts/deploy-app.sh

      # deploy-app.sh pulls, migrates first, replaces, waits for healthy and
      # ready, rolls back to the previous image on failure and prints the
      # availability report. Its stages are bounded (22 minutes in all); with
      # the 15-minute wait for the host lock that stays inside the 45-minute
      # job timeout.
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
          TOOLING_COMMIT: ${{ github.sha }}
        run: |
          ssh prod bash << EOF
          set -e
          exec 9>>~/.etg-deploy.lock
          flock -w 900 9 || { echo "Another deploy has held ~/.etg-deploy.lock for 15 minutes; giving up." >&2; exit 1; }
          cd ~/email-to-telegram

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u vladkarok --password-stdin
          IMAGE_TAG="${RELEASE_TAG}" DEPLOY_TOOLING_COMMIT="${TOOLING_COMMIT}" bash ./deploy-app.sh </dev/null
          EOF
