# Deploy the self-hosted monitoring stack (Prometheus, Grafana, Loki, Promtail,
# the Loki push gateway) to the staging VM.
#
# Required repository secrets:
#   METRICS_BEARER_TOKEN_STAGING - bearer token Prometheus uses to scrape the
#                                  staging app /metrics endpoint.
#   METRICS_BEARER_TOKEN_PROD    - bearer token for prod scrape (optional;
#                                  may be unset until prod scrape is enabled).
#
# The deploy job is bound to the GitHub environment `staging`:
#   secret   HOST_TLS_CERT, HOST_TLS_KEY   push gateway certificate (10.0.88.3)
#   secret   EXPORTER_BASIC_AUTH_PASSWORD  what Prometheus sends to the host agents
#   secret   LOKI_PUSH_PASSWORD            accepted by the push gateway
#   secret   LOKI_PUSH_PASSWORD_SECONDARY  only during a rotation
#   variable EXPORTER_BASIC_AUTH_USER      prometheus-a (default) or prometheus-b
#   variable LOKI_PUSH_USER                promtail-a (default) or promtail-b
#
# The remote side (monitoring/deploy/stack-deploy.sh) runs under the host
# lock. See docs/operations/monitoring.md.
name: Deploy Monitoring

on:
  push:
    branches: [main]
    paths:
      - "monitoring/**"
      # The host agent has its own workflow; only the shared helpers matter here.
      - "!monitoring/agent/**"
      - "monitoring/agent/deploy/lib.sh"
      - ".github/workflows/deploy-monitoring.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Runs start in trigger order and queue instead of replacing each other; the
# deploy job also shares host-staging with every other job that changes the VM.
concurrency:
  group: deploy-monitoring
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: Validate monitoring config
    if: github.repository == 'Vladkarok/email-to-telegram'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: CA certificate is in the repo
        run: |
          openssl x509 -in monitoring/tls/ca.crt -noout -subject ||
            { echo "::error::monitoring/tls/ca.crt is missing or not a certificate (see docs/operations/monitoring.md)"; exit 1; }

      - name: Install promtool
        run: |
          set -e
          curl -sSL -o /tmp/prom.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz
          tar -xzf /tmp/prom.tar.gz -C /tmp
          sudo mv /tmp/prometheus-2.55.1.linux-amd64/promtool /usr/local/bin/promtool
          promtool --version

      # promtool check config opens the secret and CA files referenced in the
      # config, so we create dummies at the exact paths the production config
      # references (/etc/prometheus/secrets/..., /etc/prometheus-secrets/...,
      # /etc/monitoring-tls/ca.crt). This does not mutate the config under test.
      - name: Stage dummy secret files
        run: |
          sudo mkdir -p /etc/prometheus/secrets /etc/prometheus-secrets /etc/monitoring-tls
          echo "dummy" | sudo tee /etc/prometheus/secrets/staging_token >/dev/null
          echo "dummy" | sudo tee /etc/prometheus/secrets/prod_token >/dev/null
          echo "dummy" | sudo tee /etc/prometheus-secrets/prometheus-a >/dev/null
          sudo cp monitoring/tls/ca.crt /etc/monitoring-tls/ca.crt

      - name: promtool check config
        run: promtool check config monitoring/prometheus/prometheus.yml

      - name: Install yamllint
        run: pip install --user yamllint

      - name: yamllint monitoring/
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" monitoring/

      - name: shellcheck
        run: |
          shellcheck -x monitoring/deploy/*.sh monitoring/deploy/tests/*.sh

      - name: Validate monitoring compose syntax
        env:
          MONITORING_BIND_IP: 127.0.0.1
          LOKI_PUSH_BIND_IP: 10.0.88.3
          GRAFANA_ADMIN_PASSWORD: x
          GRAFANA_ADMIN_USER: admin
          GRAFANA_ROOT_URL: http://127.0.0.1:3001/
        run: |
          docker compose -f monitoring/docker-compose.monitoring.yml config -q

      - name: Promtail config syntax
        run: |
          image=$(awk '/image: grafana\/promtail:/ { print $2; exit }' monitoring/docker-compose.monitoring.yml)
          docker run --rm -v "$PWD/monitoring/promtail:/etc/promtail:ro" "$image" \
            -config.file=/etc/promtail/promtail-config.yml -check-syntax

      - name: nginx -t and push gateway behaviour (pinned images)
        run: bash monitoring/deploy/tests/gateway-test.sh

  deploy:
    name: Deploy monitoring stack to staging VPS
    if: github.repository == 'Vladkarok/email-to-telegram'
    runs-on: [self-hosted, linux, x64, email-tg-staging]
    needs: validate
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: host-staging
      cancel-in-progress: false
      queue: max
    env:
      SSH_HOST: staging

    steps:
      - uses: actions/checkout@v7

      - name: Validate secrets and render the payload
        env:
          LOKI_PUSH_BIND_IP: 10.0.88.3
          HOST_TLS_CERT: ${{ secrets.HOST_TLS_CERT }}
          HOST_TLS_KEY: ${{ secrets.HOST_TLS_KEY }}
          EXPORTER_BASIC_AUTH_USER: ${{ vars.EXPORTER_BASIC_AUTH_USER }}
          EXPORTER_BASIC_AUTH_PASSWORD: ${{ secrets.EXPORTER_BASIC_AUTH_PASSWORD }}
          LOKI_PUSH_USER: ${{ vars.LOKI_PUSH_USER }}
          LOKI_PUSH_PASSWORD: ${{ secrets.LOKI_PUSH_PASSWORD }}
          LOKI_PUSH_PASSWORD_SECONDARY: ${{ secrets.LOKI_PUSH_PASSWORD_SECONDARY }}
          METRICS_BEARER_TOKEN_STAGING: ${{ secrets.METRICS_BEARER_TOKEN_STAGING }}
          METRICS_BEARER_TOKEN_PROD: ${{ secrets.METRICS_BEARER_TOKEN_PROD }}
          # bcrypt runs in the pinned httpd image on the staging VM.
          HTPASSWD_VIA: ssh staging
        run: bash monitoring/deploy/render-payload.sh "$RUNNER_TEMP/etg-monitoring"

      - name: Upload the payload
        run: |
          set -euo pipefail
          incoming=$(tar -C "$RUNNER_TEMP/etg-monitoring/payload" -cf - . |
            ssh "$SSH_HOST" 'umask 077 && d=$(mktemp -d "$HOME/.etg-incoming.XXXXXXXX") && tar -xf - -C "$d" && echo "$d"')
          echo "ETG_INCOMING=$incoming" >> "$GITHUB_ENV"

      # Under the host lock: .env and bind-IP checks, sync to ~/monitoring/
      # (the operator's .env, token files, secrets/ and deploy state are kept
      # out of rsync --delete), bearer tokens and secrets, compose up,
      # Prometheus reload, recreate of services whose config changed, health
      # wait, push gateway check.
      - name: Deploy the monitoring stack
        run: |
          ssh "$SSH_HOST" "bash '$ETG_INCOMING/stack-deploy.sh' '$ETG_INCOMING'" < "$RUNNER_TEMP/etg-monitoring/stdin"

      # Under the host lock: after a cancel the remote script may still be
      # running, and this waits for it instead of pulling its files away.
      - name: Remove the payload
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/etg-monitoring"
          if [ -n "${ETG_INCOMING:-}" ]; then
            ssh "$SSH_HOST" "exec 9>>~/.etg-deploy.lock && flock -w 900 9 && rm -rf '$ETG_INCOMING'"
          fi
