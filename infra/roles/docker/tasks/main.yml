---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker is enabled and started
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# Docker must not start before the VM has its private IPv4 address, or the
# ports published on it stay unbound (see files/wait-ipv4).
- name: Install the wait-ipv4 boot guard
  ansible.builtin.copy:
    src: wait-ipv4
    dest: /usr/local/sbin/wait-ipv4
    mode: "0755"

- name: Create the docker.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Make docker.service wait for the IPv4 address
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-wait-ipv4.conf
    mode: "0644"
    content: |
      [Service]
      # Wait for the private address before dockerd binds published ports; see /usr/local/sbin/wait-ipv4.
      ExecStartPre=/usr/local/sbin/wait-ipv4 {{ docker_wait_ipv4_interface | default(ansible_default_ipv4.interface) }} 180
  register: docker_wait_ipv4_dropin

- name: Reload systemd after the drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: docker_wait_ipv4_dropin.changed
