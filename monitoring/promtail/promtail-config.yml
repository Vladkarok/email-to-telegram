# Promtail on the staging VM: ships the staging app container's logs to Loki
# using Docker service discovery through the read-only socket proxy. Static
# label env=staging. Prod logs arrive through loki-gateway from the prod host
# agent (monitoring/agent/), not from here.
#
# App-only allowlist, the same as on prod: only containers of compose project
# email-to-telegram, service app, are tailed. Postgres (its log can contain
# statement text), the monitoring stack and any other project on this VM are
# never read.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  # Persisted in a named docker volume (mounted at /positions) so Promtail
  # resumes tailing from the correct offset across restarts.
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      # Talks to the docker_socket_proxy (read-only Docker API surface)
      # instead of the raw host socket. See docker-compose.monitoring.yml.
      - host: tcp://docker_socket_proxy:2375
        refresh_interval: 30s
        # Ask Docker for the app container only. A relabel `keep` alone does
        # not stop docker_sd from tailing the other containers: their lines
        # go out with an empty label set, and Loki rejects the whole batch
        # ("at least one label pair is required per stream"), app lines
        # included. Label filters are ANDed.
        filters:
          - name: label
            values:
              - com.docker.compose.project=email-to-telegram
              - com.docker.compose.service=app
    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
          - __meta_docker_container_label_com_docker_compose_service
        separator: ";"
        regex: "email-to-telegram;app"
        action: keep
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container_name
      - source_labels: ["__meta_docker_container_id"]
        target_label: container_id
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - target_label: env
        replacement: staging
    # No pipeline stages: the Docker target already delivers the decoded log
    # line and its timestamp (the json-file envelope stages belong to the prod
    # collector, which tails the files directly).
