# Promtail on the staging VM: tails Docker's json-file logs from the host
# (mounted read-only), keeps only the staging app container's lines and
# pushes them to the local Loki with the static label env=staging. No Docker
# API. Prod logs arrive through loki-gateway from the prod host agent
# (monitoring/agent/), which runs the same pipeline.
#
# Why files and not Docker service discovery: Docker SD followed the log
# stream through the socket proxy, whose 10-minute idle timeout cut it every
# 10 minutes on a quiet app. Each reconnect re-read from the last saved
# second, so the same startup lines were pushed again; once the app logged a
# newer line (the 02:00 UTC backup), Loki rejected the resent ones as "entry
# too far behind" for the next two hours, every night. A file position is a
# byte offset and is never re-read.
#
# The app service's logging options add `attrs` to every json line
# (labels: com.docker.compose.project,com.docker.compose.service). A line is
# kept only when attrs names project email-to-telegram and service app.
# Postgres (its log can contain statement text), the monitoring stack and any
# other project on this VM are dropped here and never reach Loki.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  # Persisted in a named docker volume (mounted at /positions) so Promtail
  # resumes tailing from the correct offset across restarts.
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: app-json-file
    static_configs:
      - targets: [localhost]
        labels:
          env: staging
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      # The json-file envelope: {"log": "...", "stream": "...", "attrs": {...}, "time": "..."}
      - json:
          expressions:
            output: log
            stream: stream
            time: time
            compose_project: 'attrs."com.docker.compose.project"'
            service: 'attrs."com.docker.compose.service"'
      - labels:
          stream:
          compose_project:
          service:
      # App-only allowlist. A line without attrs has neither label and is
      # dropped by the first rule.
      - match:
          selector: '{compose_project!="email-to-telegram"}'
          action: drop
          drop_counter_reason: not_app_container
      - match:
          selector: '{service!="app"}'
          action: drop
          drop_counter_reason: not_app_container
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output
      # The file path carries the container ID; keep the stream set small.
      - labeldrop:
          - filename
