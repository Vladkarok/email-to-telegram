# Loki push gateway: the only way into Loki from outside the staging
# monitoring network. TLS with the host certificate, basic auth (htpasswd with
# one bcrypt line per accepted user), POST to the push path only, everything
# else 403. Runs as uid 101 on a read-only root filesystem; temp paths live on
# the /tmp tmpfs and request bodies are streamed to Loki, never written to disk.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 64;
}

http {
  server_tokens off;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  client_max_body_size 4m;
  client_body_buffer_size 1m;
  client_body_timeout 30s;
  client_header_timeout 10s;
  keepalive_timeout 65s;

  # Docker's embedded DNS, so a recreated Loki container is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 3101 ssl;

    ssl_certificate /etc/loki-gateway-secrets/tls.crt;
    ssl_certificate_key /etc/loki-gateway-secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location = /loki/api/v1/push {
      access_log off;

      limit_except POST {
        deny all;
      }
      auth_basic "loki push";
      auth_basic_user_file /etc/loki-gateway-secrets/htpasswd;

      set $loki_upstream http://loki:3100;
      proxy_pass $loki_upstream;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_max_temp_file_size 0;
      proxy_set_header Connection "";
      proxy_set_header Authorization "";
      proxy_set_header Host loki;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    location / {
      return 403;
    }
  }

  # Container-local health check; not published.
  server {
    listen 127.0.0.1:8080;
    access_log off;

    location = /healthz {
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }
}
